name: Windows portable build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint
        run: .\.venv\Scripts\python.exe -m ruff check src tests tools
      - name: Test without OpenGL
        env:
          QT_QPA_PLATFORM: offscreen
          ORBIT_WIZARD_DISABLE_3D: '1'
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Build portable folder
        run: .\.venv\Scripts\python.exe -m PyInstaller --clean --noconfirm orbit-wizard-blue.spec
      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'orbit-smoke.json'
          $process = Start-Process -FilePath '.\dist\orbit-wizard-blue\orbit-wizard-blue.exe' -ArgumentList @('--smoke-test', '--smoke-output', $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; exit $process.ExitCode }
          if (-not (Test-Path $report)) { throw 'Smoke report was not written' }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if ($json.status -ne 'ok') { Get-Content $report; throw 'Smoke test failed' }
      - name: Check frozen GUI and OpenGL at three display scales
        shell: pwsh
        run: |
          $env:QT_OPENGL = 'software'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'orbit-gui-check'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $failed = $false
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $folder = Join-Path $outputRoot ('scale-' + $scale.Replace('.', '_'))
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            $process = Start-Process -FilePath '.\dist\orbit-wizard-blue\orbit-wizard-blue.exe' -ArgumentList @('--gui-check', '--gui-check-output-dir', "`"$folder`"") -Wait -PassThru
            $reportPath = Join-Path $folder 'gui-check-report.json'
            if ($process.ExitCode -ne 0 -or -not (Test-Path $reportPath)) {
              Write-Error "GUI check failed at scale $scale (exit $($process.ExitCode))" -ErrorAction Continue
              $failed = $true
              continue
            }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.status -ne 'ok') {
              Write-Error "GUI report failed at scale $scale" -ErrorAction Continue
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Upload GUI check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-wizard-blue-gui-check
          path: ${{ runner.temp }}/orbit-gui-check/
          if-no-files-found: warn
      - name: Include documentation and license notices
        shell: pwsh
        run: |
          Copy-Item README.md dist\orbit-wizard-blue\README.md
          Copy-Item LICENSES.txt dist\orbit-wizard-blue\LICENSES.txt
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\orbit-wizard-blue -DestinationPath dist\orbit-wizard-blue-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-wizard-blue-windows-x64
          path: dist/orbit-wizard-blue-windows-x64.zip
          if-no-files-found: error
