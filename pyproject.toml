[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-wizard-blue"
version = "0.1.0"
description = "Korean satellite orbit desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.9.3",
  "pyqtgraph==0.13.7",
  "PyOpenGL==3.1.10",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "astropy==7.1.0",
  "astropy-iers-data==0.2026.10.12.1.3.27",
  "sgp4==2.24",
  "platformdirs==4.4.0",
]

[project.scripts]
orbit-wizard-blue = "orbit_wizard_blue.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit_wizard_blue = ["assets/*.geojson", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
